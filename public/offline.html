<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — Avanti</title>
  <style>
    html,body{margin:0;height:100%}
    body{display:flex;align-items:center;justify-content:center;background:radial-gradient(135% 135% at 28% 18%,#17402a 0%,#0d1122 52%,#080b16 100%);color:#fff;font-family:'Sora','Segoe UI',system-ui,-apple-system,Arial,sans-serif;text-align:center;padding:24px}
    .card{max-width:340px}
    svg{width:72px;height:72px;margin:0 auto 20px;display:block}
    h1{font-size:22px;font-weight:700;margin:0 0 8px}
    p{font-size:14px;line-height:1.6;color:#9aa8c6;margin:0 0 20px}
    button{background:#16bd69;color:#04160c;border:0;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:700;font-family:inherit}
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 8 L14 90 L32 90 L50 46 L68 90 L86 90 Z" fill="#fff"/>
      <path d="M58 66 L68 90 L86 90 L69 50 Z" fill="#16BD69"/>
      <path d="M20 90 C 34 62, 40 46, 50 34 C 58 24, 66 20, 78 16" stroke="#0d1122" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    </svg>
    <h1>You're offline</h1>
    <p>Avanti needs a connection to load. Check your internet and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
